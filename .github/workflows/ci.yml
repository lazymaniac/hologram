name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tree-sitter grammars
        # Package list comes from the tool so new languages are covered automatically.
        run: |
          pip install $(python -c "import hologram; print(' '.join(hologram._grammar_pkgs(set(hologram._GRAMMAR_MODULES))))")
      - name: Run tests
        run: python tools/run_tests.py --profile full

  map-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Embedded map is current
        run: python hologram.py check --root .
