name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag must match the package version
        # fail here, at build, instead of at PyPI upload with "file already
        # exists" after a tag was pushed without bumping _version.py
        run: |
          pkg="$(python -c 'from hologram._version import __version__; print(__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v$tag but hologram/_version.py says $pkg — bump the version and re-tag"
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build
      - name: Build single-file zipapp
        # into its own directory — the PyPI publish job uploads everything in
        # dist/, and a .pyz there fails twine's distribution check
        run: |
          mkdir -p staging pyz
          cp -R hologram staging/
          find staging -name __pycache__ -type d -exec rm -rf {} +
          python -m zipapp staging -o pyz/hologram.pyz \
            -p "/usr/bin/env python3" -m "hologram.cli:main" --compress
          python3 pyz/hologram.pyz --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pyz
          path: pyz/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: pyz
          path: dist/
      - name: Extract changelog section for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
