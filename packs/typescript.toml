lang = "typescript"

[[detector]]
concept = "test_spec"
pattern = '(?:it|test)\(["\x27]([^"\x27]+)'
value = 1

[[detector]]
concept = "entry_point"
pattern = '(?:app|router)\.(?:get|post|put|delete|patch)\(["\x27]([^"\x27]+)'
value = 1
kind = "http"

[[detector]]
concept = "config"
pattern = 'process\.env\.([A-Z0-9_]+)'
value = 1

[[detector]]
concept = "error"
pattern = 'throw new (\w+(?:Error|Exception)?)'
value = 1

[[detector]]
concept = "persistence"
pattern = '["\x27`](?:SELECT|INSERT|UPDATE|DELETE|MERGE|MATCH|CREATE) [^"\x27`]{0,60}'
value = 0
