lang = "java"

[[detector]]
concept = "test_spec"
pattern = '@DisplayName\("([^"]+)"\)'
value = 1

[[detector]]
concept = "test_spec"
pattern = 'void\s+(\w+)\s*\(\s*\)\s*\{'
value = 1
path = 'Test\.java$'
transform = "camel_to_words"

[[detector]]
concept = "entry_point"
pattern = 'public static void main'
value = 0
kind = "main"

[[detector]]
concept = "entry_point"
pattern = '@(?:Get|Post|Put|Delete|Patch|Request)Mapping\(([^)]*)\)'
value = 1
kind = "http"

[[detector]]
concept = "invariant"
pattern = 'requireNonNull\([^;]*\)'
value = 0

[[detector]]
concept = "invariant"
pattern = 'throw new (?:IllegalArgumentException|IllegalStateException)\("([^"]+)"\)'
value = 1

[[detector]]
concept = "invariant"
pattern = 'sealed (?:interface|class) \w+[^{]*permits ([^{]+)'
value = 1

[[detector]]
concept = "config"
pattern = 'System\.getenv\("([^"]+)"\)'
value = 1

[[detector]]
concept = "config"
pattern = '@Value\("\$\{([^}:]+)[^}]*\}"\)'
value = 1

[[detector]]
concept = "error"
pattern = 'throw new (\w+(?:Exception|Error))'
value = 1

[[detector]]
concept = "persistence"
pattern = '@(?:Entity|Table|Repository|Document|Node)\b'
value = 0

[[detector]]
concept = "persistence"
pattern = '"(?:SELECT|INSERT|UPDATE|DELETE|MERGE|MATCH|CREATE) [^"]{0,60}'
value = 0
